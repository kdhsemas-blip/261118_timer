<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>피카 포모도로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: character portrait inside an electric progress ring, time + speech bubble below, controls, settings, log */
:root {
  --bg: #fffbea;
  --surface: #ffffff;
  --fg: #2b2410;
  --muted: #7a6f4e;
  --line: #f0e3b0;
  --volt: #f5c518;      /* focus: electric yellow */
  --volt-deep: #c99a00;
  --cheek: #e2533e;
  --grass: #4fa83d;     /* short break */
  --sky: #3f8fd2;       /* long break */
  --accent: var(--volt);
  --accent-ink: #2b2410;
  --font-cute: "Jua", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-num: "Space Grotesk", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1808; --surface: #262210; --fg: #fbf3d2; --muted: #b3a77c; --line: #3d3618;
    --volt: #ffd23a; --grass: #6cc458; --sky: #63a9e6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1808; --surface: #262210; --fg: #fbf3d2; --muted: #b3a77c; --line: #3d3618;
  --volt: #ffd23a; --grass: #6cc458; --sky: #63a9e6; color-scheme: dark;
}
body[data-mode="short"] { --accent: var(--grass); --accent-ink: #fff; }
body[data-mode="long"] { --accent: var(--sky); --accent-ink: #fff; }

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px;
  background-image: radial-gradient(circle at 50% 0, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%);
  background-repeat: no-repeat; transition: background-color .4s;
}
.wrap {
  min-height: 100%; box-sizing: border-box; max-width: 520px; margin: 0 auto;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-cute); font-weight: 400; font-size: 26px; margin: 0; display: flex; align-items: center; gap: 6px; }
h1 svg { width: 22px; height: 22px; }
.today { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.today b { font-family: var(--font-num); color: var(--fg); }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; }
.tabs button { font: 18px var(--font-cute); color: var(--muted); background: none; border: 0; border-radius: 12px; padding: 8px 4px; cursor: pointer; transition: background .2s, color .2s; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tabs button:hover:not([aria-selected="true"]) { color: var(--fg); }

.stage { position: relative; width: min(100%, 320px); aspect-ratio: 1; max-width: 100%; margin: 4px auto 0; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.track { stroke: var(--line); }
.arc { stroke: var(--accent); transition: stroke .4s; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--accent) 60%, transparent)); }
.bolt { fill: var(--accent); stroke: var(--fg); stroke-width: 1; stroke-linejoin: round; transition: fill .4s; }
.portrait {
  position: absolute; inset: 13%; border-radius: 50%; overflow: hidden;
  border: 4px solid var(--surface); box-shadow: 0 6px 24px color-mix(in srgb, var(--accent) 35%, transparent);
  background: var(--grass);
}
.portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; transform: scale(1.65); transform-origin: 41.5% 27%; /* puts the face (source ≈ 492,245 px) at the circle centre */ display: block; transition: transform .6s; }
body.running[data-mode="focus"] .portrait img { animation: hum 2.4s ease-in-out infinite; }
body.running:not([data-mode="focus"]) .portrait { animation: bounce 1.6s ease-in-out infinite; }
.stage.zap .portrait { animation: zap .9s ease-out; }
.stage.zap::after {
  content: ""; position: absolute; inset: -6%; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--volt) 70%, transparent), transparent 65%);
  animation: flash .9s ease-out forwards;
}
@keyframes hum { 0%,100% { transform: scale(1.65) rotate(0); } 50% { transform: scale(1.68) rotate(-1.5deg); } }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes zap { 0%,100% { transform: translate(0); } 15% { transform: translate(-5px, 2px); } 30% { transform: translate(5px, -2px); } 45% { transform: translate(-3px, 1px); } 60% { transform: translate(3px, 0); } }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

.readout { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.time { font-family: var(--font-num); font-weight: 700; font-size: clamp(56px, 18vw, 80px); line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.bubble {
  position: relative; font-family: var(--font-cute); font-size: 18px; background: var(--surface);
  border: 2px solid var(--line); border-radius: 16px; padding: 6px 16px; max-width: 100%; text-align: center;
}
.bubble::before { content: ""; position: absolute; top: -9px; left: 50%; width: 14px; height: 14px; background: var(--surface); border-left: 2px solid var(--line); border-top: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
.dots { display: flex; gap: 8px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--cheek); box-sizing: border-box; transition: background .3s; }
.dots i.on { background: var(--cheek); }

.controls { display: flex; justify-content: center; align-items: center; gap: 12px; }
.btn { white-space: nowrap; flex-shrink: 0; font: 17px var(--font-cute); color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 999px; height: 48px; padding: 0 18px; cursor: pointer; transition: border-color .2s, transform .1s; }
.btn:hover { border-color: var(--muted); }
.btn:active { transform: scale(.96); }
.btn.primary { background: var(--accent); border-color: var(--fg); color: var(--accent-ink); font-size: 21px; min-width: 136px; height: 58px; box-shadow: 0 4px 0 var(--fg); transition: background .4s, transform .1s, box-shadow .1s; }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--fg); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--cheek); outline-offset: 2px; }

.task { display: flex; flex-direction: column; gap: 6px; }
label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
input[type="text"], input[type="number"] { font: 15px var(--font-body); color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; box-sizing: border-box; }

details { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; }
summary { cursor: pointer; padding: 12px 14px; font: 17px var(--font-cute); list-style: none; display: flex; justify-content: space-between; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--muted); }
details[open] summary::after { content: "−"; }
.settings { padding: 0 14px 14px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.settings .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.settings .row { grid-column: 1 / -1; display: flex; gap: 18px; flex-wrap: wrap; }
.settings .row label { font-size: 14px; color: var(--fg); letter-spacing: 0; display: flex; align-items: center; gap: 6px; cursor: pointer; }
input[type="checkbox"] { accent-color: var(--volt-deep); width: 16px; height: 16px; }

.log h2 { font: 17px var(--font-cute); margin: 0 0 6px; }
.log ol { list-style: none; margin: 0; padding: 0; }
.log li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 2px dotted var(--line); font-size: 14px; }
.log li span { min-width: 0; overflow-wrap: anywhere; }
.log li time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.log .empty { color: var(--muted); }
.keys { color: var(--muted); font-size: 12px; text-align: center; margin: 0; }
kbd { font-family: var(--font-num); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

@media (max-width: 400px) {
  .controls { gap: 8px; }
  .btn { padding: 0 12px; font-size: 15px; }
  .btn.primary { min-width: 112px; font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

  <div class="readout">
    <div class="time" id="time">25:00</div>
    <div class="bubble" id="bubble">피카! 같이 집중해 볼까?</div>
    <div class="dots" id="dots" title="긴 휴식까지 모은 뽀모도로"></div>
  </div>

  <div class="controls">
    <button class="btn" id="reset" title="초기화 (R)">처음부터</button>
    <button class="btn primary" id="toggle" title="시작/일시정지 (Space)">시작!</button>
    <button class="btn" id="skip" title="다음 단계로 (S)">건너뛰기</button>
  </div>

  <div class="task">
    <label for="taskInput">지금 하는 일</label>
    <input type="text" id="taskInput" placeholder="예: 영어 단어 30개 외우기" maxlength="60">
  </div>

  <details>
    <summary>설정</summary>
    <div class="settings">
      <div class="field"><label for="setFocus">집중 (분)</label><input type="number" id="setFocus" min="1" max="120" value="25"></div>
      <div class="field"><label for="setShort">짧은 휴식 (분)</label><input type="number" id="setShort" min="1" max="60" value="5"></div>
      <div class="field"><label for="setLong">긴 휴식 (분)</label><input type="number" id="setLong" min="1" max="90" value="15"></div>
      <div class="field"><label for="setEvery">긴 휴식 주기 (회)</label><input type="number" id="setEvery" min="2" max="10" value="4"></div>
      <div class="row">
        <label><input type="checkbox" id="setAuto" checked> 다음 단계 자동 시작</label>
        <label><input type="checkbox" id="setSound" checked> 알림음</label>
      </div>
    </div>
  </details>

  <section class="log">
    <h2>오늘 모은 뽀모도로</h2>
    <ol id="log"></ol>
  </section>

  <p class="keys"><kbd>Space</kbd> 시작/정지 · <kbd>R</kbd> 처음부터 · <kbd>S</kbd> 건너뛰기</p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const todayKey = () => new Date().toLocaleDateString('sv');

  const settings = Object.assign({ focus: 25, short: 5, long: 15, every: 4, auto: true, sound: true }, store.get('pika-settings', {}));
  let history = store.get('pika-history', { date: todayKey(), items: [] });
  if (history.date !== todayKey()) history = { date: todayKey(), items: [] };

  const LINES = {
    focus: { idle: '피카! 같이 집중해 볼까?', run: ['피카피카… 집중 중!', '찌릿찌릿, 잘하고 있어!', '조금만 더 힘내자, 피카!'], paused: '피카? 잠깐 쉬는 거야?' },
    short: { idle: '수고했어! 잠깐 쉬자, 피카~', run: ['기지개 쭉~ 피카!', '물 한 잔 마시고 와!'], paused: '휴식도 잠깐 멈춤!' },
    long:  { idle: '대단해! 푹 쉬자, 피카츄~', run: ['산책 다녀올까? 피카!', '눈도 좀 쉬게 해 줘!'], paused: '휴식도 잠깐 멈춤!' }
  };

  let mode = 'focus', count = 0;
  let total = settings.focus * 60000, remaining = total, endAt = 0, timer = null, wakeLock = null, lineIdx = 0;

  const R = 92, C = 2 * Math.PI * R;
  $('arc').setAttribute('stroke-dasharray', C);
  const fmt = ms => { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

  function bubble() {
    const L = LINES[mode];
    if (timer) return L.run[lineIdx % L.run.length];
    return remaining < total ? L.paused : L.idle;
  }

  function render() {
    const t = fmt(remaining);
    $('time').textContent = t;
    const p = total ? remaining / total : 0;
    $('arc').setAttribute('stroke-dashoffset', C * (1 - p));
    const a = (1 - p) * 2 * Math.PI;
    $('hand').setAttribute('transform', `translate(${100 + R * Math.sin(a)} ${100 - R * Math.cos(a)}) scale(1.3)`);
    document.title = timer ? `${t} · ${mode === 'focus' ? '집중' : '휴식'}` : '피카 포모도로';
    $('toggle').textContent = timer ? '잠깐!' : (remaining < total ? '계속!' : '시작!');
    $('bubble').textContent = bubble();
    document.body.dataset.mode = mode;
    document.body.classList.toggle('running', !!timer);
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.mode === mode));
    const dots = $('dots'); dots.innerHTML = '';
    for (let i = 0; i < settings.every; i++) { const d = document.createElement('i'); if (i < count) d.className = 'on'; dots.appendChild(d); }
  }

  function renderLog() {
    const items = history.items, mins = items.reduce((s, x) => s + x.min, 0);
    $('today').innerHTML = `오늘 <b>${items.length}</b>개 · <b>${mins}</b>분`;
    const ol = $('log'); ol.innerHTML = '';
    if (!items.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = '아직 없어요. 첫 뽀모도로를 모아 보세요!'; ol.appendChild(li); return; }
    items.slice().reverse().forEach(x => {
      const li = document.createElement('li');
      const s = document.createElement('span'); s.textContent = '⚡ ' + (x.task || '이름 없는 작업');
      const t = document.createElement('time'); t.textContent = `${x.at} · ${x.min}분`;
      li.append(s, t); ol.appendChild(li);
    });
  }

  function setMode(m, autoStart = false) {
    stop(); mode = m; total = remaining = settings[m] * 60000; render();
    if (autoStart) start();
  }
  function tick() {
    remaining = Math.max(0, endAt - Date.now());
    const idx = Math.floor((total - remaining) / 60000);  // change line every minute
    if (idx !== lineIdx) lineIdx = idx;
    render();
    if (remaining <= 0) finish();
  }
  async function start() {
    if (timer) return;
    unlockAudio();
    endAt = Date.now() + remaining;
    timer = setInterval(tick, 250);
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
    render();
  }
  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    try { wakeLock?.release(); } catch {} wakeLock = null;
    render();
  }
  function zap() {
    const s = $('stage'); s.classList.remove('zap'); void s.offsetWidth; s.classList.add('zap');
    setTimeout(() => s.classList.remove('zap'), 950);
  }
  function finish(skipped = false) {
    stop();
    if (mode === 'focus') {
      if (!skipped) {
        history.items.push({ task: $('taskInput').value.trim(), min: settings.focus, at: new Date().toTimeString().slice(0, 5) });
        store.set('pika-history', history); renderLog();
        chime(3); zap();
      }
      count = Math.min(count + 1, settings.every);
      setMode(count >= settings.every ? 'long' : 'short', settings.auto && !skipped);
    } else {
      if (mode === 'long') count = 0;
      if (!skipped) { chime(2); zap(); }
      setMode('focus', settings.auto && !skipped);
    }
  }

  // Sound: short "zap" chirp + bell, via WebAudio
  let ctx = null;
  function unlockAudio() { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } ctx?.resume?.(); }
  function chime(n) {
    if (!settings.sound || !ctx) return;
    for (let i = 0; i < n; i++) {
      const t = ctx.currentTime + i * 0.38;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(1500, t); o.frequency.exponentialRampToValueAtTime(700, t + 0.12);
      o.frequency.exponentialRampToValueAtTime(1100, t + 0.25);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.4);
    }
  }

  $('toggle').onclick = () => timer ? stop() : start();
  $('reset').onclick = () => setMode(mode);
  $('skip').onclick = () => finish(true);
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

  const fields = { setFocus: 'focus', setShort: 'short', setLong: 'long', setEvery: 'every' };
  Object.entries(fields).forEach(([id, k]) => {
    const el = $(id); el.value = settings[k];
    el.addEventListener('change', () => {
      const v = Math.round(Number(el.value));
      settings[k] = Math.min(Number(el.max), Math.max(Number(el.min), v || settings[k])); el.value = settings[k];
      store.set('pika-settings', settings);
      if (k === 'every') { count = Math.min(count, settings.every - 1); render(); }
      else if (k === mode && !timer && remaining === total) setMode(mode);
    });
  });
  [['setAuto', 'auto'], ['setSound', 'sound']].forEach(([id, k]) => {
    const el = $(id); el.checked = settings[k];
    el.addEventListener('change', () => { settings[k] = el.checked; store.set('pika-settings', settings); });
  });
  const ti = $('taskInput'); ti.value = store.get('pika-task', '');
  ti.addEventListener('input', () => store.set('pika-task', ti.value));

  document.addEventListener('keydown', e => {
    if (e.target.matches('input')) return;
    if (e.code === 'Space') { e.preventDefault(); $('toggle').click(); }
    else if (e.key === 'r' || e.key === 'R') $('reset').click();
    else if (e.key === 's' || e.key === 'S') $('skip').click();
  });
  document.addEventListener('visibilitychange', () => { if (timer) tick(); });

  total = remaining = settings.focus * 60000;
  render(); renderLog();
})();
</script>
</body>
</html>
